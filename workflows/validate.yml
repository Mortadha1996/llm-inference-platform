name: Validate manifests

on:
  push:
    branches: [main]
    paths: ['k8s/**']
  pull_request:
    paths: ['k8s/**']

jobs:
  kubeconform:
    name: Schema validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install kubeconform
        run: |
          curl -sL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/

      - name: Validate manifests against Kubernetes schemas
        run: kubeconform -summary -strict -ignore-missing-schemas k8s/

  yamllint:
    name: YAML lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install yamllint
        run: pip install yamllint

      - name: Lint YAML
        run: yamllint -d "{extends: relaxed, rules: {line-length: {max: 160}}}" k8s/

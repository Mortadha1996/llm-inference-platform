name: Validate manifests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  kubeconform:
    name: Schema validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install kubeconform
        run: |
          curl -sL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/

      - name: Validate manifests against Kubernetes schemas
        run: kubeconform -summary -strict -ignore-missing-schemas k8s/

  yamllint:
    name: YAML lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install yamllint
        run: pip install yamllint

      - name: Create lint config
        run: |
          cat > .yamllint.yml << 'YAMLEOF'
          extends: relaxed
          rules:
            line-length:
              max: 200
          YAMLEOF

      - name: Lint YAML
        run: yamllint -c .yamllint.yml k8s/

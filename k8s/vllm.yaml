apiVersion: v1
kind: Namespace
metadata:
  name: inference
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm
  namespace: inference
  labels:
    app: vllm
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vllm
  template:
    metadata:
      labels:
        app: vllm
    spec:
      runtimeClassName: nvidia
      enableServiceLinks: false
      automountServiceAccountToken: false
      containers:
        - name: vllm
          image: vllm/vllm-openai:v0.6.3
          env:
            - name: VLLM_PORT
              value: "8000"
            - name: HF_HOME
              value: /cache
          args:
            - "--model"
            - "Qwen/Qwen2.5-0.5B-Instruct"
            - "--gpu-memory-utilization"
            - "0.70"
            - "--max-model-len"
            - "1024"
            - "--dtype"
            - "half"
            - "--enforce-eager"
          ports:
            - containerPort: 8000
              name: http
          resources:
            requests:
              memory: "4Gi"
              cpu: "1"
            limits:
              memory: "12Gi"
              cpu: "6"
              nvidia.com/gpu: 1
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: cache
              mountPath: /cache
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 40
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 15
      volumes:
        - name: cache
          hostPath:
            path: /home/oscp/.cache/huggingface
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: vllm
  namespace: inference
spec:
  type: ClusterIP
  selector:
    app: vllm
  ports:
    - port: 8000
      targetPort: 8000
